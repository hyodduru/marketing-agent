# 유튜브 댓글 에이전트 설정
profiles: [유튜브1, 유튜브2, 유튜브3]   # profiles/<이름> 폴더에 크롬 프로필이 저장됩니다

search:
  # '|' 는 유튜브 검색의 OR 연산자입니다. 연애 '고민'을 다루는 영상 위주로 찾습니다.
  query: "연애 고민|남자 심리|여자 심리|썸 신호|재회 방법|짝사랑|연애 상담|이별 후|헤어진 연인"
  published_within_days: 14    # 최근 N일 안에 올라온 영상만
  max_per_channel: 2           # 채널당 최대 영상 수
  min_duration_sec: 181        # 쇼츠 제외 (쇼츠는 댓글 화면이 달라 자동 게시가 불안정)
  # 방송사 예능 클립은 연애 '고민' 영상이 아니라서 제외합니다
  exclude_channels: [SBS, 스브스, MBC, KBS, JTBC, tvN, TV조선, MBN, 채널A, ENA, Mnet, TVING, 티빙, 쿠팡플레이, 웨이브, Wavve, Netflix, 넷플릭스, 디즈니, 엠뚜루마뚜루, 스브스예능]
  exclude_title_words: [선공개, 예고, 하이라이트, 풀버전, "EP.", 회차, 클립]

# 가점: 뜨기 직전 영상 (초안까지만)
rising:
  query: 연애
  within_hours: 48
  min_views: 1000
  max_views: 5000
  min_views_per_hour: 150
  # 드라마 · 예능 회차 클립 제외 (연애 '고민' 영상이 아님)
  exclude_title_words: [웹드라마, "#drama", "#드라마", 몰아보기]

comment:
  min_chars: 40
  max_chars: 120
  brand: 운명원

limits:
  daily_max_comments: 10
  allow_shorts_post: false   # 쇼츠 게시 허용 여부 (기본: 초안까지만)
